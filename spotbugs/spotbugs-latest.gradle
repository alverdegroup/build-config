spotbugs {
    toolVersion = '4.10.4'
    ignoreFailures = false
    showProgress = true
    effort = "MAX"
    reportLevel = "DEFAULT"
}

tasks.spotbugsMain {
    reports.create("xml") {
        required =true
        outputLocation = layout.buildDirectory.file("reports/spotbugs/main.xml")
    }
    reports.create("html") {
        required.set(true)
        outputLocation = layout.buildDirectory.file("reports/spotbugs/main.html")
    }
}
