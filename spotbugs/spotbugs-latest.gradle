spotbugs {
    ignoreFailures = false
    showProgress = true
    effort = "MAX"
    reportLevel = "DEFAULT"
}

tasks.named("spotbugsMain") {
    reports.create("xml") {
        required.set(true)
        outputLocation.set(layout.buildDirectory.file("reports/spotbugs/main.xml"))
    }
    reports.create("html") {
        required.set(true)
        outputLocation.set(layout.buildDirectory.file("reports/spotbugs/main.html"))
    }
}